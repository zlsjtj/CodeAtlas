services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CODE_AGENT_OPENAI_MODEL: ${CODE_AGENT_OPENAI_MODEL:-gpt-4.1-mini}
      CODE_AGENT_CORS_ORIGINS: '["http://127.0.0.1:${CODEATLAS_FRONTEND_PORT:-3000}","http://localhost:${CODEATLAS_FRONTEND_PORT:-3000}"]'
    ports:
      - "127.0.0.1:${CODEATLAS_BACKEND_PORT:-8000}:8000"
    volumes:
      - atlas-data:/app/data
      - atlas-repos:/app/repos
    init: true
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${CODEATLAS_BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${CODEATLAS_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  atlas-data:
  atlas-repos:
